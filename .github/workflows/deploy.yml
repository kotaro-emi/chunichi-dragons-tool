name: Deploy to GitHub Pages

# masterへのpush、または手動実行（Actionsタブから）で動く。
# buildジョブはどのブランチへのpushでも走らせて「ビルドが壊れていないか」を確認できるようにし、
# 実際に公開サイトを書き換えるdeployジョブはmasterブランチのときだけ実行する
# （開発計画書2.5節：フィーチャーブランチでビルド失敗を試しても本番サイトには影響しない設計）
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # data/*.json が壊れていた場合、原因がわかりやすいようにビルド前に検証する
      # （開発計画書2.5節：ルーティンが壊れたJSONをpushしてもビルド失敗の理由がすぐわかるようにする）
      - name: Validate data/*.json
        run: |
          for f in data/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8'))" || { echo "::error::$f is not valid JSON"; exit 1; }
          done

      - name: Install, build, and upload site
        uses: withastro/action@v3
        with:
          node-version: 22
        env:
          # SupabaseのURL/anonキーは公開前提の値（秘密情報ではない、RLSが防御線）。
          # リポジトリのSettings > Secrets and variables > Actions > Variables で設定する。
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
