<style>

  }
  @media (prefers-color-scheme: dark) {
    :root {
      --navy-900: #eef1f6;
      --navy-800: #cfd9ea;
      --navy-700: #9db3d6;
      --blue-accent: #6ea1dd;
      --blue-accent-soft: #1c2c46;
      --call-red: #e2836c;
      --call-red-soft: #3a2420;
      --paper: #0c121f;
      --card: #131b2b;
      --card-border: #263355;
      --ink: #e7eaf1;
      --ink-soft: #9aa5bb;
      --rule: #2a3654;
    }
  }
  :root[data-theme="dark"] {
    --navy-900: #eef1f6;
    --navy-800: #cfd9ea;
    --navy-700: #9db3d6;
    --blue-accent: #6ea1dd;
    --blue-accent-soft: #1c2c46;
    --call-red: #e2836c;
    --call-red-soft: #3a2420;
    --paper: #0c121f;
    --card: #131b2b;
    --card-border: #263355;
    --ink: #e7eaf1;
    --ink-soft: #9aa5bb;
    --rule: #2a3654;
  }
  :root[data-theme="light"] {
    --navy-900: #101d34;
    --navy-800: #16264a;
    --navy-700: #21396b;
    --blue-accent: #2f6fb5;
    --blue-accent-soft: #e4ecf6;
    --call-red: #a8402c;
    --call-red-soft: #f6e6e1;
    --paper: #f0f1ec;
    --card: #fbfbf8;
    --card-border: #dcdcd2;
    --ink: #1b2431;
    --ink-soft: #57606f;
    --rule: #c8cabf;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: var(--navy-900);
    color: var(--paper);
    padding: 2.2rem 1.5rem 1.6rem;
    text-align: center;
  }
  header h1 {
    margin: 0 0 0.4rem;
    font-size: clamp(1.4rem, 4vw, 2rem);
    letter-spacing: 0.02em;
  }
  header p {
    margin: 0;
    color: var(--blue-accent-soft);
    font-size: 0.85rem;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.4rem 1rem 3rem;
  }

  .meta-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem 1.2rem;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 0.8rem 1.1rem;
    margin-bottom: 1.2rem;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  .meta-bar strong { color: var(--ink); }
  .badge {
    display: inline-block;
    background: var(--blue-accent-soft);
    color: var(--navy-700);
    border-radius: 999px;
    padding: 0.15rem 0.7rem;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    background: var(--card);
  }
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 920px;
    font-size: 0.86rem;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--navy-800);
    color: var(--paper);
    padding: 0.6rem 0.5rem;
    text-align: center;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  thead th.name-col { text-align: left; padding-left: 0.9rem; }
  thead th:hover { background: var(--navy-700); }
  thead th.sorted::after { content: " ▾"; opacity: 0.7; }
  tbody td {
    padding: 0.5rem;
    text-align: center;
    border-top: 1px solid var(--rule);
    white-space: nowrap;
  }
  tbody td.name-col {
    text-align: left;
    padding-left: 0.9rem;
    font-weight: 600;
    color: var(--navy-800);
  }
  :root[data-theme="dark"] tbody td.name-col { color: var(--blue-accent); }
  @media (prefers-color-scheme: dark) {
    tbody td.name-col { color: var(--blue-accent); }
  }
  tbody tr:nth-child(even) { background: var(--blue-accent-soft); }
  tbody tr:hover { background: var(--call-red-soft); }

  .avg-high { color: var(--call-red); font-weight: 700; }

  footer {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 1rem 2.5rem;
    font-size: 0.8rem;
    color: var(--ink-soft);
  }
  footer a { color: var(--blue-accent); }
  .note {
    margin-top: 1.4rem;
    padding: 0.9rem 1.1rem;
    border-left: 3px solid var(--blue-accent);
    background: var(--card);
    border-radius: 0 8px 8px 0;
  }
</style>
</head>
<body>
<header>
  <h1>中日ドラゴンズ 打者成績</h1>
  <p>NPB公式サイトのデータをもとに、試合終了後に自動更新されます</p>
</header>

<main>
  <div class="meta-bar">
    <div>最終更新: <strong id="updated-at">2026-07-27 (JST) 手動初期登録</strong></div>
    <div><span class="badge" id="season-badge">2026年度 セ・リーグ公式戦</span></div>
  </div>

  <div class="table-wrap">
    <table id="stats-table">
      <thead>
        <tr>
          <th class="name-col" data-key="name" data-type="string">選手名</th>
          <th data-key="g" data-type="num">試合</th>
          <th data-key="pa" data-type="num">打席</th>
          <th data-key="ab" data-type="num">打数</th>
          <th data-key="r" data-type="num">得点</th>
          <th data-key="h" data-type="num">安打</th>
          <th data-key="double" data-type="num">二塁打</th>
          <th data-key="triple" data-type="num">三塁打</th>
          <th data-key="hr" data-type="num">本塁打</th>
          <th data-key="tb" data-type="num">塁打</th>
          <th data-key="rbi" data-type="num">打点</th>
          <th data-key="sb" data-type="num">盗塁</th>
          <th data-key="bb" data-type="num">四球</th>
          <th data-key="hbp" data-type="num">死球</th>
          <th data-key="so" data-type="num">三振</th>
          <th data-key="gdp" data-type="num">併殺打</th>
          <th data-key="avg" data-type="num" class="sorted">打率</th>
          <th data-key="slg" data-type="num">長打率</th>
          <th data-key="obp" data-type="num">出塁率</th>
          <th data-key="ops" data-type="num">OPS</th>
        </tr>
      </thead>
      <tbody id="stats-body"></tbody>
    </table>
  </div>

  <div class="note">
    <strong>このページについて</strong><br>
    データ出典: <a href="https://npb.jp/bis/2026/stats/idb1_d.html" target="_blank" rel="noopener">NPB.jp 日本野球機構 — 中日ドラゴンズ個人打撃成績</a><br>
    毎試合終了後、スケジュール実行されるエージェントが最新の成績を取得し、このページを自動更新します。列見出しをクリックすると並べ替えできます。
  </div>
</main>

<footer>
  <a href="https://npb.jp/bis/2026/stats/idb1_d.html" target="_blank" rel="noopener">NPB公式データを見る</a>
</footer>

<script>
  // データ本体: 自動更新エージェントがこの配列を書き換える
  const PLAYERS = [
    {name:"細川成也", g:94, pa:395, ab:323, r:46, h:72, double:11, triple:1, hr:15, tb:130, rbi:47, sb:0, bb:63, hbp:6, so:105, gdp:7, avg:.223, slg:.402, obp:.357},
    {name:"村松開人", g:91, pa:378, ab:312, r:40, h:77, double:11, triple:5, hr:5, tb:113, rbi:34, sb:4, bb:51, hbp:3, so:66, gdp:9, avg:.247, slg:.362, obp:.353},
    {name:"石川昂弥", g:56, pa:203, ab:184, r:20, h:49, double:12, triple:0, hr:7, tb:82, rbi:29, sb:0, bb:18, hbp:1, so:48, gdp:4, avg:.266, slg:.446, obp:.335},
    {name:"岡林勇希", g:46, pa:203, ab:180, r:13, h:43, double:8, triple:0, hr:1, tb:54, rbi:13, sb:1, bb:15, hbp:2, so:23, gdp:1, avg:.239, slg:.300, obp:.299},
    {name:"石伊雄太", g:69, pa:249, ab:230, r:21, h:59, double:12, triple:1, hr:6, tb:91, rbi:21, sb:0, bb:9, hbp:5, so:61, gdp:3, avg:.257, slg:.396, obp:.297},
    {name:"田中幹也", g:73, pa:247, ab:213, r:24, h:50, double:9, triple:1, hr:0, tb:61, rbi:11, sb:8, bb:17, hbp:3, so:25, gdp:2, avg:.235, slg:.286, obp:.298},
    {name:"福永裕基", g:65, pa:223, ab:198, r:20, h:51, double:6, triple:0, hr:2, tb:63, rbi:13, sb:8, bb:22, hbp:3, so:43, gdp:3, avg:.258, slg:.318, obp:.341},
    {name:"サノー", g:50, pa:186, ab:160, r:19, h:37, double:4, triple:0, hr:13, tb:80, rbi:25, sb:0, bb:22, hbp:2, so:52, gdp:3, avg:.231, slg:.500, obp:.328},
    {name:"ボスラー", g:61, pa:215, ab:198, r:11, h:38, double:5, triple:1, hr:5, tb:60, rbi:16, sb:0, bb:12, hbp:3, so:62, gdp:2, avg:.192, slg:.303, obp:.247},
    {name:"鵜飼航丞", g:49, pa:164, ab:155, r:16, h:38, double:6, triple:0, hr:5, tb:59, rbi:22, sb:1, bb:7, hbp:2, so:46, gdp:5, avg:.245, slg:.381, obp:.287},
    {name:"板山祐太郎", g:62, pa:166, ab:149, r:20, h:37, double:7, triple:2, hr:6, tb:66, rbi:23, sb:1, bb:15, hbp:1, so:39, gdp:4, avg:.248, slg:.443, obp:.319},
    {name:"阿部寿樹", g:52, pa:108, ab:90, r:11, h:25, double:5, triple:0, hr:3, tb:39, rbi:19, sb:0, bb:15, hbp:1, so:27, gdp:4, avg:.278, slg:.433, obp:.383},
    {name:"高橋周平", g:45, pa:99, ab:86, r:7, h:23, double:2, triple:0, hr:0, tb:25, rbi:5, sb:0, bb:11, hbp:1, so:28, gdp:2, avg:.267, slg:.291, obp:.357},
  ];

  function fmt3(x) {
    if (x === null || x === undefined || isNaN(x)) return "-";
    return x.toFixed(3).replace(/^0/, "");
  }

  function render() {
    const tbody = document.getElementById("stats-body");
    tbody.innerHTML = "";
    const maxAvg = Math.max(...PLAYERS.map(p => p.avg));
    PLAYERS.forEach(p => {
      const ops = p.slg + p.obp;
      const tr = document.createElement("tr");
      const cells = [
        ["name-col", p.name],
        ["", p.g], ["", p.pa], ["", p.ab], ["", p.r], ["", p.h],
        ["", p.double], ["", p.triple], ["", p.hr], ["", p.tb], ["", p.rbi],
        ["", p.sb], ["", p.bb], ["", p.hbp], ["", p.so], ["", p.gdp],
        [p.avg === maxAvg ? "avg-high" : "", fmt3(p.avg)],
        ["", fmt3(p.slg)], ["", fmt3(p.obp)], ["", fmt3(ops)],
      ];
      cells.forEach(([cls, val]) => {
        const td = document.createElement("td");
        if (cls) td.className = cls;
        td.textContent = val;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  let sortKey = "avg", sortDir = -1;
  function sortPlayers(key, type) {
    if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = -1; }
    document.querySelectorAll("thead th").forEach(th => th.classList.remove("sorted"));
    document.querySelector(`thead th[data-key="${key}"]`).classList.add("sorted");
    PLAYERS.sort((a, b) => {
      let av = key === "ops" ? a.slg + a.obp : a[key];
      let bv = key === "ops" ? b.slg + b.obp : b[key];
      if (type === "string") return sortDir * String(av).localeCompare(String(bv), "ja");
      return sortDir * ((av ?? -Infinity) - (bv ?? -Infinity));
    });
    render();
  }

  document.querySelectorAll("thead th").forEach(th => {
    th.addEventListener("click", () => sortPlayers(th.dataset.key, th.dataset.type));
  });

  sortPlayers("avg", "num");
</script>
</body>
</html>
